[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tron-analysis"
version = "2.0.0"
description = "Analisi investigativa dei flussi TRX/TRC20 sulla rete TRON"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tron-analysis = "tron_analysis.cli:main"

[tool.setuptools.packages.find]
include = ["tron_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
